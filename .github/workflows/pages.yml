name: Deploy Sumthing LAN Party
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify game rules and multiplayer API
        run: node --test tests/*.test.mjs
      - name: Check browser JavaScript
        run: node --check app.js
      - uses: actions/configure-pages@v5
      - name: Prepare browser app
        run: |
          mkdir -p _site/server _site/assets
          cp index.html app.js settings.js styles.css .nojekyll _site/
          cp server/content.mjs server/map.mjs server/engine.mjs server/restoration.mjs _site/server/
          cp assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
